
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus lembretes</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">


        <header class="header">

            <div>
                <h1>LEMBRETES</h1>
                <p>Gerenciamento de lembretes</p>
            </div>

            <div class="form-actions">

                <button id="btnImprimir" class="btn btn-secondary" type="button">
                    Imprimir
                </button>

                <button id="btnNovo" class="btn btn-primary" type="button">
                    + Novo lembrete
                </button>

            </div>

        </header>



        <section id="formulario" class="card hidden">

            <h2 id="tituloFormulario">Novo lembrete</h2>

            <form id="formLembrete" novalidate>

                <input type="hidden" id="lembreteId">

                <div class="form-group">

                    <label for="descricao">Descrição</label>

                    <input type="text"
                           id="descricao"
                           placeholder="Digite o lembrete..."
                           maxlength="500"
                           required>

                </div>

                <div class="form-actions">

                    <button type="button"
                            id="btnCancelar"
                            class="btn btn-secondary">
                        Cancelar
                    </button>

                    <button type="submit"
                            class="btn btn-primary">
                        Salvar
                    </button>

                </div>

            </form>

        </section>



        <section class="card">

            <div class="filtro">


                <div class="form-group">

                    <label for="filtroDescricao">
                        Descrição
                    </label>

                    <input type="text"
                           id="filtroDescricao"
                           placeholder="Pesquisar por descrição...">

                </div>



                <div class="form-group">

                    <label for="filtroDataCadastroInicial">
                        Cadastro inicial
                    </label>

                    <input type="date"
                           id="filtroDataCadastroInicial">

                </div>



                <div class="form-group">

                    <label for="filtroDataCadastroFinal">
                        Cadastro final
                    </label>

                    <input type="date"
                           id="filtroDataCadastroFinal">

                </div>



                <div class="form-group">

                    <label for="filtroDataAtualizacaoInicial">
                        Atualização inicial
                    </label>

                    <input type="date"
                           id="filtroDataAtualizacaoInicial">

                </div>



                <div class="form-group">

                    <label for="filtroDataAtualizacaoFinal">
                        Atualização final
                    </label>

                    <input type="date"
                           id="filtroDataAtualizacaoFinal">

                </div>



                <div class="form-group">

                    <label for="tamanhoPagina">
                        Registros por página
                    </label>

                    <select id="tamanhoPagina">

                        <option value="5">5 registros</option>

                        <option value="10" selected>10 registros</option>

                        <option value="20">20 registros</option>

                    </select>

                </div>



                <button id="btnFiltrar"
                        class="btn btn-primary"
                        type="button">
                    Aplicar filtros
                </button>

            </div>

        </section>


        <section class="card">

            <div class="table-header">

                <h2>Lembretes</h2>

                <span id="totalRegistros">
                    0 registros
                </span>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th scope="col" aria-sort="descending">
                                <button type="button"
                                        class="sort-button"
                                        data-sort="Descricao"
                                        aria-pressed="false">
                                    Descrição
                                    <span class="sort-indicator">↕</span>
                                </button>
                            </th>


                            <th scope="col" aria-sort="none">
                                <button type="button"
                                        class="sort-button"
                                        data-sort="DataCadastro"
                                        aria-pressed="true">
                                    Cadastro
                                    <span class="sort-indicator">↓</span>
                                </button>
                            </th>


                            <th scope="col" aria-sort="none">
                                <button type="button"
                                        class="sort-button"
                                        data-sort="DataAtualizacao"
                                        aria-pressed="false">
                                    Atualização
                                    <span class="sort-indicator">↕</span>
                                </button>
                            </th>


                            <th scope="col">
                                Status
                            </th>


                            <th scope="col">
                                Ações
                            </th>

                        </tr>

                    </thead>


                    <tbody id="listaLembretes">
                    </tbody>

                </table>



                <div id="mensagemVazia" class="empty hidden">
                    Nenhum lembrete encontrado.
                </div>

            </div>


  
            <div class="pagination">

                <button id="btnAnterior"
                        class="btn btn-secondary"
                        type="button"
                        disabled>
                    ← Anterior
                </button>


                <span id="paginaAtual">
                    Página 1 de 1
                </span>


                <button id="btnProximo"
                        class="btn btn-secondary"
                        type="button"
                        disabled>
                    Próxima →
                </button>

            </div>

        </section>

    </main>



    <div id="toast"
         class="toast hidden"
         role="status"
         aria-live="polite"></div>


    <script src="js/app.js"></script>

</body>
</html>
